name: security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
      - run: npm install --global npm@11.16.0
      - run: npm run prepare:quality
      - name: Check all available Git history for secrets
        run: npm run check-secrets -- --history
      - name: Report dependency advisories for all locked npm projects
        if: always()
        run: npm run audit:dependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audit-${{ github.run_attempt }}
          path: output/security/*-audit.json
          if-no-files-found: warn
          retention-days: 7
