name: fieldwork
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CI: "true"
concurrency:
  group: fieldwork-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run example:test
      - run: FIELDWORK_NO_NEGENTROPY=1 npx playwright test --config examples/fieldwork/playwright.config.ts --grep "independent NIP-77"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fieldwork-results
          path: |
            output/fieldwork/report*
            output/fieldwork/*results
            output/fieldwork/services.log
          retention-days: 7
