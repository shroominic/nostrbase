name: fieldwork
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CI: "true"
concurrency:
  group: fieldwork-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run example:test
      - run: FIELDWORK_NO_NEGENTROPY=1 npx playwright test --config examples/fieldwork/playwright.config.ts --grep "independent NIP-77"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fieldwork-results
          path: |
            output/fieldwork/report*
            output/fieldwork/*results
            output/fieldwork/services.log
          retention-days: 7
